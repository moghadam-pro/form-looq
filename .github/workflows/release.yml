name: Build or Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix, for example 0.4.0'
        required: true
        type: string
      create_draft_release:
        description: 'Create a draft instead of publishing immediately'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/release-trigger'

permissions:
  contents: write

jobs:
  # Running the full quality suite (PHP/JS syntax, WPCS, WordPress Plugin
  # Check, and real WordPress integration/browser tests) as a dependency of
  # this workflow — rather than leaving it as a separate, optional run — is
  # what makes a green "Build or Publish Release" mean the packaged plugin
  # actually passed those checks, instead of only meaning the ZIP built.
  quality-gates:
    name: Quality gates
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  build:
    name: Build release package
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          HEADER_VERSION="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' form-looq/form-looq.php | head -n 1 | tr -d '\r')"
          STABLE_TAG="$(sed -n 's/^Stable tag:[[:space:]]*//p' form-looq/readme.txt | head -n 1 | tr -d '\r')"
          VERSION="${REQUESTED_VERSION:-$HEADER_VERSION}"
          test "$VERSION" = "$HEADER_VERSION"
          test "$VERSION" = "$STABLE_TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin ZIP
        run: bash scripts/build-plugin.sh

      - name: Verify release package
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/form-looq.zip
          unzip -tq dist/form-looq.zip
          test "$(unzip -Z1 dist/form-looq.zip | head -n 1 | cut -d/ -f1)" = "form-looq"
          unzip -p dist/form-looq.zip form-looq/form-looq.php | grep -q "Version: ${{ steps.version.outputs.version }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: form-looq-${{ steps.version.outputs.version }}
          path: dist/form-looq.zip
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ inputs.create_draft_release }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi

          RELEASE_ARGS=(
            "$TAG"
            dist/form-looq.zip
            --target "$GITHUB_SHA"
            --title "Form LOOQ $TAG"
            --generate-notes
          )

          if [[ "$DRAFT" == "true" ]]; then
            RELEASE_ARGS+=(--draft)
          fi

          gh release create "${RELEASE_ARGS[@]}"
