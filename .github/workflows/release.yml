name: Build or Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix, for example 0.1.0'
        required: true
        type: string
      create_draft_release:
        description: 'Create a draft GitHub release after building'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build release package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate requested version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          HEADER_VERSION="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' free-mpro-forms/free-mpro-forms.php | head -n 1 | tr -d '\r')"
          STABLE_TAG="$(sed -n 's/^Stable tag:[[:space:]]*//p' free-mpro-forms/readme.txt | head -n 1 | tr -d '\r')"
          test "$REQUESTED_VERSION" = "$HEADER_VERSION"
          test "$REQUESTED_VERSION" = "$STABLE_TAG"
      - name: Build plugin ZIP
        run: bash scripts/build-plugin.sh
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-mpro-forms-${{ inputs.version }}
          path: dist/free-mpro-forms.zip
          if-no-files-found: error
      - name: Create draft GitHub release
        if: ${{ inputs.create_draft_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          gh release create "$TAG" dist/free-mpro-forms.zip \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Free MPRO Forms ${TAG}" \
            --generate-notes
