name: WordPress Quality Checks

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  wpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install coding standards
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate PHPCS report
        shell: bash
        run: |
          set +e
          vendor/bin/phpcs --standard=phpcs.xml.dist --report=json > phpcs-report.json
          echo "$?" > phpcs-exit-code
          set -e

      - name: Upload PHPCS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpcs-report
          path: phpcs-report.json
          if-no-files-found: error

      - name: Enforce WordPress Coding Standards
        run: test "$(cat phpcs-exit-code)" -eq 0

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './free-mpro-forms'
          slug: 'free-mpro-forms'
