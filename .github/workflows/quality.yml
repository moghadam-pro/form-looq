name: Controlled Release Gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/ci/run-quality'
  # Lets "Build or Draft Release" require this entire suite to pass in the
  # same run, instead of only building and shipping a ZIP on its own.
  workflow_call:

permissions:
  contents: read

jobs:
  syntax-and-validator:
    name: PHP ${{ matrix.php }} syntax and validator
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find form-looq tests -type f -name '*.php' -print0)
      - name: Run validator tests
        run: php tests/validator-test.php

  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find form-looq tests/e2e -type f -name '*.js' -print0)

  wordpress-standards:
    name: WordPress security standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - name: Install coding standards
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run focused WPCS gate
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './form-looq'
          slug: 'form-looq'
          exclude-checks: 'plugin_review_phpcs'
          # WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedConstantFound
          # was previously ignored repo-wide for the one legitimate case
          # (DONOTCACHEPAGE, a cross-plugin caching convention that must stay
          # unprefixed) — that line now carries its own inline
          # phpcs:ignore instead, so this global exclusion is no longer needed.
          ignore-codes: |
            WordPress.Security.EscapeOutput.OutputNotEscaped

  # Runs the same tool with none of the exclusions above, so what it actually
  # flags is visible instead of hidden behind exclude-checks/ignore-codes.
  # This unrestricted run is enforced so a release cannot hide new errors
  # behind the narrowed compatibility gate above.
  plugin-check-strict:
    name: WordPress Plugin Check (unrestricted)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Plugin Check with no exclusions
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './form-looq'
          slug: 'form-looq'

  data-lifecycle:
    name: WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.5'
            php: '8.1'
          - wordpress: 'latest'
            php: '8.3'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: wp-cli
      - name: Install WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/form-looq-wordpress
          wp core download --version="${{ matrix.wordpress }}" --path=/tmp/form-looq-wordpress --force
          wp config create \
            --path=/tmp/form-looq-wordpress \
            --dbname=wordpress_test \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp core install \
            --path=/tmp/form-looq-wordpress \
            --url=http://form-looq.test \
            --title="Form LOOQ Integration" \
            --admin_user=admin \
            --admin_password=integration-password \
            --admin_email=admin@example.com \
            --skip-email
      - name: Install and activate plugin
        shell: bash
        run: |
          set -euo pipefail
          cp -R "$GITHUB_WORKSPACE/form-looq" /tmp/form-looq-wordpress/wp-content/plugins/form-looq
          wp plugin activate form-looq --path=/tmp/form-looq-wordpress
      - name: Run privacy, retention, and uninstall checks
        run: wp eval-file "$GITHUB_WORKSPACE/tests/integration/privacy-retention-uninstall.php" --path=/tmp/form-looq-wordpress
      - name: Run rate-limit checks
        run: wp eval-file "$GITHUB_WORKSPACE/tests/integration/rate-limit.php" --path=/tmp/form-looq-wordpress

  browser-e2e:
    name: Chromium LTR RTL and keyboard validation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_browser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Install browser-test WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/form-looq-browser-wordpress
          wp core download --version=latest --path=/tmp/form-looq-browser-wordpress --force
          wp config create \
            --path=/tmp/form-looq-browser-wordpress \
            --dbname=wordpress_browser \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp core install \
            --path=/tmp/form-looq-browser-wordpress \
            --url=http://127.0.0.1:8080 \
            --title="Form LOOQ Browser Tests" \
            --admin_user=admin \
            --admin_password=browser-password \
            --admin_email=admin@example.com \
            --skip-email
          cp -R "$GITHUB_WORKSPACE/form-looq" /tmp/form-looq-browser-wordpress/wp-content/plugins/form-looq
          wp plugin activate form-looq --path=/tmp/form-looq-browser-wordpress
          wp eval-file "$GITHUB_WORKSPACE/tests/e2e/seed-wordpress.php" --path=/tmp/form-looq-browser-wordpress
      - name: Start WordPress server
        shell: bash
        run: |
          set -euo pipefail
          nohup wp server --host=127.0.0.1 --port=8080 --path=/tmp/form-looq-browser-wordpress > /tmp/form-looq-wp-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/english-form/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/form-looq-wp-server.log
          exit 1
      - name: Run Chromium browser tests
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report
            test-results
            /tmp/form-looq-wp-server.log
          if-no-files-found: ignore

  package-build:
    name: Build installable ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build plugin package
        run: bash scripts/build-plugin.sh
      - name: Verify archive root
        shell: bash
        run: |
          set -euo pipefail
          test "$(unzip -Z1 dist/form-looq.zip | head -n 1)" = 'form-looq/'
          unzip -Z1 dist/form-looq.zip | grep -q '^form-looq/form-looq.php$'
          unzip -Z1 dist/form-looq.zip | grep -q '^form-looq/readme.txt$'
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: form-looq-package
          path: dist/form-looq.zip
          if-no-files-found: error

  release-candidate:
    name: Packaged clean-install release candidate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_rc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli
      - name: Build release candidate ZIP
        run: bash scripts/build-plugin.sh
      - name: Install clean WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/form-looq-rc-wordpress
          wp core download --version=latest --path=/tmp/form-looq-rc-wordpress --force
          wp config create \
            --path=/tmp/form-looq-rc-wordpress \
            --dbname=wordpress_rc \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp core install \
            --path=/tmp/form-looq-rc-wordpress \
            --url=http://form-looq-rc.test \
            --title="Form LOOQ Release Candidate" \
            --admin_user=admin \
            --admin_password=rc-password \
            --admin_email=admin@example.com \
            --skip-email
      - name: Install the packaged ZIP
        run: wp plugin install "$GITHUB_WORKSPACE/dist/form-looq.zip" --activate --path=/tmp/form-looq-rc-wordpress
      - name: Read the packaged version
        shell: bash
        run: |
          set -euo pipefail
          HEADER_VERSION="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' form-looq/form-looq.php | head -n 1 | tr -d '\r')"
          echo "FORM_LOOQ_RC_VERSION=$HEADER_VERSION" >> "$GITHUB_ENV"
      - name: Create and verify packaged data
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(wp eval-file "$GITHUB_WORKSPACE/tests/integration/release-candidate.php" --path=/tmp/form-looq-rc-wordpress)"
          echo "$RESULT" | jq -e --arg version "$FORM_LOOQ_RC_VERSION" '.version == $version and .form_id > 0 and .entry_id > 0' >/dev/null
          echo "FORM_LOOQ_RC_FORM_ID=$(echo "$RESULT" | jq -r '.form_id')" >> "$GITHUB_ENV"
          echo "FORM_LOOQ_RC_ENTRY_ID=$(echo "$RESULT" | jq -r '.entry_id')" >> "$GITHUB_ENV"
      - name: Verify deactivate and reactivate cycle
        shell: bash
        run: |
          set -euo pipefail
          wp plugin deactivate form-looq --path=/tmp/form-looq-rc-wordpress
          wp plugin activate form-looq --path=/tmp/form-looq-rc-wordpress
          test "$(wp db query "SELECT COUNT(*) FROM wp_looq_entries WHERE id = $FORM_LOOQ_RC_ENTRY_ID" --skip-column-names --path=/tmp/form-looq-rc-wordpress)" = '1'
      # The core promise of the dedicated-table storage model (since 0.2.0):
      # deleting the plugin and reinstalling it must leave forms and entries
      # untouched.
      - name: Verify default uninstall preserves data
        shell: bash
        run: |
          set -euo pipefail
          wp plugin deactivate form-looq --path=/tmp/form-looq-rc-wordpress
          wp plugin uninstall form-looq --path=/tmp/form-looq-rc-wordpress
          test "$(wp db query "SELECT COUNT(*) FROM wp_looq_forms WHERE id = $FORM_LOOQ_RC_FORM_ID" --skip-column-names --path=/tmp/form-looq-rc-wordpress)" = '1'
          test "$(wp db query "SELECT COUNT(*) FROM wp_looq_entries WHERE id = $FORM_LOOQ_RC_ENTRY_ID" --skip-column-names --path=/tmp/form-looq-rc-wordpress)" = '1'
      - name: Reinstall the same ZIP and verify preserved data
        shell: bash
        run: |
          set -euo pipefail
          wp plugin install "$GITHUB_WORKSPACE/dist/form-looq.zip" --activate --path=/tmp/form-looq-rc-wordpress
          test "$(wp plugin get form-looq --field=version --path=/tmp/form-looq-rc-wordpress)" = "$FORM_LOOQ_RC_VERSION"
          test "$(wp db query "SELECT status FROM wp_looq_forms WHERE id = $FORM_LOOQ_RC_FORM_ID" --skip-column-names --path=/tmp/form-looq-rc-wordpress)" = 'active'
          test "$(wp db query "SELECT status FROM wp_looq_entries WHERE id = $FORM_LOOQ_RC_ENTRY_ID" --skip-column-names --path=/tmp/form-looq-rc-wordpress)" = 'unread'
      - name: Verify opt-in uninstall removes the tables
        shell: bash
        run: |
          set -euo pipefail
          wp option update form_looq_settings '{"delete_data_on_uninstall":true}' --format=json --path=/tmp/form-looq-rc-wordpress
          wp plugin deactivate form-looq --path=/tmp/form-looq-rc-wordpress
          wp plugin uninstall form-looq --path=/tmp/form-looq-rc-wordpress
          test "$(wp db query "SHOW TABLES LIKE 'wp_looq_forms'" --skip-column-names --path=/tmp/form-looq-rc-wordpress)" = ''
          test "$(wp db query "SHOW TABLES LIKE 'wp_looq_entries'" --skip-column-names --path=/tmp/form-looq-rc-wordpress)" = ''
