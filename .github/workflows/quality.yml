name: Controlled Release Gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/ci/run-quality'

permissions:
  contents: read

jobs:
  syntax-and-validator:
    name: PHP ${{ matrix.php }} syntax and validator
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find free-mpro-forms tests -type f -name '*.php' -print0)
      - name: Run validator tests
        run: php tests/validator-test.php

  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find free-mpro-forms tests/e2e -type f -name '*.js' -print0)

  wordpress-standards:
    name: WordPress security standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - name: Install coding standards
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run focused WPCS gate
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './free-mpro-forms'
          slug: 'free-mpro-forms'
          exclude-checks: 'plugin_review_phpcs'
          ignore-codes: |
            WordPress.Security.EscapeOutput.OutputNotEscaped
            WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedConstantFound

  data-lifecycle:
    name: WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.5'
            php: '8.1'
          - wordpress: 'latest'
            php: '8.3'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: wp-cli
      - name: Install WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fmpf-wordpress
          wp core download --version="${{ matrix.wordpress }}" --path=/tmp/fmpf-wordpress --force
          wp config create \
            --path=/tmp/fmpf-wordpress \
            --dbname=wordpress_test \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp core install \
            --path=/tmp/fmpf-wordpress \
            --url=http://free-mpro-forms.test \
            --title="Free MPRO Forms Integration" \
            --admin_user=admin \
            --admin_password=integration-password \
            --admin_email=admin@example.com \
            --skip-email
      - name: Install and activate plugin
        shell: bash
        run: |
          set -euo pipefail
          cp -R "$GITHUB_WORKSPACE/free-mpro-forms" /tmp/fmpf-wordpress/wp-content/plugins/free-mpro-forms
          wp plugin activate free-mpro-forms --path=/tmp/fmpf-wordpress
      - name: Run privacy, retention, and uninstall checks
        run: wp eval-file "$GITHUB_WORKSPACE/tests/integration/privacy-retention-uninstall.php" --path=/tmp/fmpf-wordpress
      - name: Run rate-limit checks
        run: wp eval-file "$GITHUB_WORKSPACE/tests/integration/rate-limit.php" --path=/tmp/fmpf-wordpress

  browser-e2e:
    name: Chromium LTR RTL and keyboard validation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_browser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Install browser-test WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fmpf-browser-wordpress
          wp core download --version=latest --path=/tmp/fmpf-browser-wordpress --force
          wp config create \
            --path=/tmp/fmpf-browser-wordpress \
            --dbname=wordpress_browser \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp core install \
            --path=/tmp/fmpf-browser-wordpress \
            --url=http://127.0.0.1:8080 \
            --title="Free MPRO Forms Browser Tests" \
            --admin_user=admin \
            --admin_password=browser-password \
            --admin_email=admin@example.com \
            --skip-email
          cp -R "$GITHUB_WORKSPACE/free-mpro-forms" /tmp/fmpf-browser-wordpress/wp-content/plugins/free-mpro-forms
          wp plugin activate free-mpro-forms --path=/tmp/fmpf-browser-wordpress
          wp eval-file "$GITHUB_WORKSPACE/tests/e2e/seed-wordpress.php" --path=/tmp/fmpf-browser-wordpress
      - name: Start WordPress server
        shell: bash
        run: |
          set -euo pipefail
          nohup wp server --host=127.0.0.1 --port=8080 --path=/tmp/fmpf-browser-wordpress > /tmp/fmpf-wp-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/english-form/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fmpf-wp-server.log
          exit 1
      - name: Run Chromium browser tests
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report
            test-results
            /tmp/fmpf-wp-server.log
          if-no-files-found: ignore

  package-build:
    name: Build installable ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build plugin package
        run: bash scripts/build-plugin.sh
      - name: Verify archive root
        shell: bash
        run: |
          set -euo pipefail
          test "$(unzip -Z1 dist/free-mpro-forms.zip | head -n 1)" = 'free-mpro-forms/'
          unzip -Z1 dist/free-mpro-forms.zip | grep -q '^free-mpro-forms/free-mpro-forms.php$'
          unzip -Z1 dist/free-mpro-forms.zip | grep -q '^free-mpro-forms/readme.txt$'
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: free-mpro-forms-package
          path: dist/free-mpro-forms.zip
          if-no-files-found: error

  release-candidate:
    name: Packaged clean-install release candidate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_rc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli
      - name: Build release candidate ZIP
        run: bash scripts/build-plugin.sh
      - name: Install clean WordPress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fmpf-rc-wordpress
          wp core download --version=latest --path=/tmp/fmpf-rc-wordpress --force
          wp config create \
            --path=/tmp/fmpf-rc-wordpress \
            --dbname=wordpress_rc \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp core install \
            --path=/tmp/fmpf-rc-wordpress \
            --url=http://free-mpro-forms-rc.test \
            --title="Free MPRO Forms Release Candidate" \
            --admin_user=admin \
            --admin_password=rc-password \
            --admin_email=admin@example.com \
            --skip-email
      - name: Install the packaged ZIP
        run: wp plugin install "$GITHUB_WORKSPACE/dist/free-mpro-forms.zip" --activate --path=/tmp/fmpf-rc-wordpress
      - name: Create and verify packaged data
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(wp eval-file "$GITHUB_WORKSPACE/tests/integration/release-candidate.php" --path=/tmp/fmpf-rc-wordpress)"
          echo "$RESULT" | jq -e '.version == "0.1.0" and .form_id > 0 and .submission_id > 0' >/dev/null
          echo "FMPF_RC_FORM_ID=$(echo "$RESULT" | jq -r '.form_id')" >> "$GITHUB_ENV"
          echo "FMPF_RC_SUBMISSION_ID=$(echo "$RESULT" | jq -r '.submission_id')" >> "$GITHUB_ENV"
      - name: Verify deactivate and reactivate cycle
        shell: bash
        run: |
          set -euo pipefail
          wp plugin deactivate free-mpro-forms --path=/tmp/fmpf-rc-wordpress
          wp plugin activate free-mpro-forms --path=/tmp/fmpf-rc-wordpress
          test "$(wp post get "$FMPF_RC_SUBMISSION_ID" --field=post_type --path=/tmp/fmpf-rc-wordpress)" = 'fmpf_submission'
      - name: Verify default uninstall preserves data
        shell: bash
        run: |
          set -euo pipefail
          wp plugin deactivate free-mpro-forms --path=/tmp/fmpf-rc-wordpress
          wp plugin uninstall free-mpro-forms --path=/tmp/fmpf-rc-wordpress
          test "$(wp post get "$FMPF_RC_FORM_ID" --field=post_type --path=/tmp/fmpf-rc-wordpress)" = 'fmpf_form'
          test "$(wp post get "$FMPF_RC_SUBMISSION_ID" --field=post_type --path=/tmp/fmpf-rc-wordpress)" = 'fmpf_submission'
      - name: Reinstall the same ZIP and verify preserved data
        shell: bash
        run: |
          set -euo pipefail
          wp plugin install "$GITHUB_WORKSPACE/dist/free-mpro-forms.zip" --activate --path=/tmp/fmpf-rc-wordpress
          test "$(wp plugin get free-mpro-forms --field=version --path=/tmp/fmpf-rc-wordpress)" = '0.1.0'
          test "$(wp post get "$FMPF_RC_FORM_ID" --field=post_status --path=/tmp/fmpf-rc-wordpress)" = 'publish'
          test "$(wp post meta get "$FMPF_RC_SUBMISSION_ID" _fmpf_status --path=/tmp/fmpf-rc-wordpress)" = 'new'
