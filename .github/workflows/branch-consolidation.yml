name: Consolidate temporary branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/branch-consolidation.yml']
permissions:
  contents: write
jobs:
  archive-and-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify, archive, and remove reviewed temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branches=(fix/plugin-check-20260914 work/formlooq-site-theme work/wp-org-review-fixes)
          shas=(b0a19420d5e7440c5cc2f2832fd834b53bd92813 62ee8e723dcdc86e364e8310cad1ff464afe951a bc5d283cda74c4e8967b9db1c145c4accdf2b907)
          tags=(snapshot/2026-09-14/plugin-check-fixes snapshot/2026-09-14/site-theme snapshot/2026-09-14/wp-org-review-fixes)
          actual="$(gh api "repos/$repo/branches?per_page=100" --jq '.[].name' | sort)"
          expected="$(printf '%s\n' main "${branches[@]}" | sort)"
          test "$actual" = "$expected"
          test "$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          git merge-base --is-ancestor "${shas[0]}" HEAD
          git merge-base --is-ancestor "${shas[1]}" HEAD
          # The old review branch's complete tree already exists in main's 0.4.2 history.
          test "$(git rev-parse "${shas[2]}^{tree}")" = "$(git rev-parse 'ce67fba^{tree}')"
          git merge-base --is-ancestor ce67fba HEAD
          # Validate all refs before mutation, then archive all three before deleting any.
          for i in "${!branches[@]}"; do
            test "$(gh api "repos/$repo/git/ref/heads/${branches[$i]}" --jq '.object.sha')" = "${shas[$i]}"
          done
          for i in "${!branches[@]}"; do
            if ! gh api "repos/$repo/git/ref/tags/${tags[$i]}" >/dev/null 2>&1; then
              gh api --method POST "repos/$repo/git/refs" -f "ref=refs/tags/${tags[$i]}" -f "sha=${shas[$i]}" >/dev/null
            fi
            test "$(gh api "repos/$repo/git/ref/tags/${tags[$i]}" --jq '.object.sha')" = "${shas[$i]}"
            echo "ARCHIVED ${branches[$i]} as ${tags[$i]}"
          done
          for i in "${!branches[@]}"; do
            test "$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
            test "$(gh api "repos/$repo/git/ref/heads/${branches[$i]}" --jq '.object.sha')" = "${shas[$i]}"
            gh api --method DELETE "repos/$repo/git/refs/heads/${branches[$i]}"
            echo "DELETED ${branches[$i]}"
          done
          test "$(gh api "repos/$repo/branches?per_page=100" --jq 'length')" = '1'
          test "$(gh api "repos/$repo/branches?per_page=100" --jq '.[0].name')" = main
          echo 'FINAL STATE: main only; all three snapshots verified.'
